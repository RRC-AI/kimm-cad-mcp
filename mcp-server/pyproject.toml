[project]
name = "kimm-cad-mcp"
version = "0.1.0"
description = "MCP server that creates geometry in a running KIMM-CAD window"
requires-python = ">=3.10"
license = "LGPL-2.1-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Korea Institute of Machinery & Materials (KIMM)" }]
dependencies = ["mcp>=1.12,<2"]

[project.scripts]
kimm-cad-mcp = "kimm_cad_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kimm_cad_mcp"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
